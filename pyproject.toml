[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-account-audit"
version = "0.1.0"
description = "Audit CRM account records against Apollo and SEC EDGAR."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-socket>=0.8",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests>=2.32",
]

[tool.setuptools.packages.find]
where = ["skills/crm-account-audit/scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/crm-account-audit/scripts"]
addopts = "--disable-socket"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "skills/crm-account-audit/scripts"
explicit_package_bases = true
files = ["skills/crm-account-audit/scripts", "tests", "tools"]
